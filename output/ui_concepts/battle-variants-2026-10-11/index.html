<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战斗界面 · 四版设计对比</title><style>*{box-sizing:border-box}body{margin:0;background:#272235;color:#f4e9d7;font-family:"Microsoft YaHei",sans-serif}main{max-width:1800px;margin:auto;padding:28px}h1{font-size:28px}p{line-height:1.7;color:#d4c8ba}nav{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}button,a{color:inherit}button{background:#584362;border:1px solid #b49a6b;border-radius:7px;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{background:#e9d3a8;color:#342a3b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.grid.single{grid-template-columns:1fr;max-width:1500px;margin:auto}article{border:1px solid #75654e;border-radius:10px;overflow:hidden;background:#342b43}img{display:block;width:100%;height:auto}h2{margin:16px 20px 6px;font-size:21px}article p{margin:0 20px 18px}article[hidden]{display:none}footer{margin-top:24px}@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:16px}}</style><main><h1>战斗界面 · 四版设计对比</h1><p>四版采用同一出牌阶段示例，保留 8×8 棋盘、双方状态、敌方行动预告和五张手牌。点击图片查看原图。均为视觉概念，尚未应用到战斗界面。</p><nav><button data-choice="all" aria-pressed="true">并排对比</button><button data-choice="a-storybook" aria-pressed="false">A · 展开绘本</button><button data-choice="b-paper-theatre" aria-pressed="false">B · 纸偶剧场</button><button data-choice="c-midnight-casket" aria-pressed="false">C · 星夜棋匣</button><button data-choice="d-ivory-desk" aria-pressed="false">D · 清爽纸卡</button></nav><section class="grid"><article data-id="a-storybook"><a href="a-storybook.png" target="_blank"><img src="a-storybook.png" alt="A · 展开绘本战斗设计图"></a><h2>A · 展开绘本</h2><p>展开书页、纸质信息区与紫金边框，延续已选地图的美术。</p></article><article data-id="b-paper-theatre"><a href="b-paper-theatre.png" target="_blank"><img src="b-paper-theatre.png" alt="B · 纸偶剧场战斗设计图"></a><h2>B · 纸偶剧场</h2><p>立体纸景与左右角色展台，强化战斗场景的舞台感。</p></article><article data-id="c-midnight-casket"><a href="c-midnight-casket.png" target="_blank"><img src="c-midnight-casket.png" alt="C · 星夜棋匣战斗设计图"></a><h2>C · 星夜棋匣</h2><p>深紫棋盘和状态面板，使用奶油色敌方意图区突出关键威胁。</p></article><article data-id="d-ivory-desk"><a href="d-ivory-desk.png" target="_blank"><img src="d-ivory-desk.png" alt="D · 清爽纸卡战斗设计图"></a><h2>D · 清爽纸卡</h2><p>浅色棋盘、细边框与更多留白，减少装饰对信息阅读的干扰。</p></article></section><footer><p>2026-10-11 · 内置 ImageGen 生成与修订 · <a href="README.md">设计说明</a> · <a href="prompts.json">生成提示词</a> · <a href="revision-prompts.json">修订提示词</a></p></footer></main><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{const choice=button.dataset.choice;document.querySelector('.grid').classList.toggle('single',choice!=='all');document.querySelectorAll('article').forEach(card=>card.hidden=choice!=='all'&&card.dataset.id!==choice);document.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script></html>
