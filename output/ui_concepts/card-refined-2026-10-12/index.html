<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡框 · 适度简化四版</title><style>*{box-sizing:border-box}body{margin:0;background:#25202e;color:#f6ead7;font-family:"Microsoft YaHei",sans-serif}main{max-width:1800px;padding:28px;margin:auto}h1{font-size:26px}p{line-height:1.7;color:#d5c8bf}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}article{background:#342b3f;border:1px solid #8c7354;padding:14px;border-radius:10px}h2{font-size:20px;margin:0 0 15px}.frame{display:flex;justify-content:center;align-items:center;background:#8b8295;padding:10px;border-radius:5px}.frame img{width:100%;display:block}.small img{width:150px;height:210px;object-fit:contain}.small .frame{min-height:232px}button{padding:10px 18px;border:1px solid #b0976b;background:#544160;color:#f8ecd3;border-radius:6px;cursor:pointer;margin:5px 0 22px}a{color:#edcc91}article p{font-size:14px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.grid{grid-template-columns:1fr}}</style><main><h1>已采用 C · 星轨嵌金（无底部角饰）</h1><p><a href="applied-card-faces.png">查看游戏实际卡面</a></p><p>在原版与上一轮极简版之间调整：保留角饰、紫金材质和主题纹样，减少重复细线。左上竖向费用区与中央透明插画窗口继续保留。</p><button id="size">查看游戏尺寸 150 × 210</button><section class="grid"><article><h2>A · 星辉轻饰</h2><a class="frame" href="a-starlit-trim.png" target="_blank"><img src="a-starlit-trim.png" alt="A · 星辉轻饰卡框设计"></a><p>保留原版切角、主金边与少量星饰，减少内层细线。</p></article><article><h2>B · 剧场绶带</h2><a class="frame" href="b-theatre-ribbon.png" target="_blank"><img src="b-theatre-ribbon.png" alt="B · 剧场绶带卡框设计"></a><p>以绶带标题、帷幕式转角和星坠延续纸偶剧场风格。</p></article><article><h2>C · 星轨嵌金</h2><a class="frame" href="c-astral-inlay-clean-corners.png" target="_blank"><img src="c-astral-inlay-clean-corners.png" alt="C · 星轨嵌金卡框设计"></a><p>深紫珐琅配嵌金星轨；已去掉底部效果区四角的星形与弧线。</p></article><article><h2>D · 绘本金页</h2><a class="frame" href="d-gilded-book.png" target="_blank"><img src="d-gilded-book.png" alt="D · 绘本金页卡框设计"></a><p>羊皮纸与紫色书封结合，用包角和压纹保留精致感。</p></article></section><p>内置 ImageGen 生成 · <a href="prompts.json">完整提示词</a> · <a href="../card-simplified-2026-10-12/index.html">上一轮简化版</a></p></main><script>document.getElementById('size').onclick=function(){const small=document.querySelector('.grid').classList.toggle('small');this.textContent=small?'查看放大细节':'查看游戏尺寸 150 × 210';};</script></html>
