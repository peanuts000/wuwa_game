<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四版简化卡框</title><style>*{box-sizing:border-box}body{margin:0;background:#24202e;color:#f5ebd9;font-family:"Microsoft YaHei",sans-serif}main{max-width:1700px;margin:auto;padding:28px}h1{font-size:26px}p{color:#cfc3ba;line-height:1.7}nav{display:flex;gap:12px;align-items:center;margin:20px 0}button,a{color:#e9c889}button{background:#40334d;border:1px solid #9c8566;border-radius:6px;padding:8px 14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}article{padding:16px;border:1px solid #615067;border-radius:12px;background:#302736}h2{font-size:19px;margin:0 0 14px}.frame{background:#958c9c;border-radius:8px;display:flex;justify-content:center;padding:12px}.frame img{display:block;width:100%;height:auto}.small .frame img{width:150px;height:210px;object-fit:contain}.small .frame{min-height:234px;align-items:center}article p{font-size:14px}footer{margin-top:24px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.grid{grid-template-columns:1fr}}</style><main><h1>四版简化卡框</h1><p>减少多层金边、星饰和高光，保留左上纵向费用区、标题、插画窗口、类别与效果区。四张均为空白卡框 PNG，便于叠加真实内容。</p><nav><button id="size">查看游戏尺寸 150 × 210</button><span>点击图片查看原图</span></nav><section class="grid"><article><h2>A · 细金边</h2><a class="frame" href="a-thin-gold.png" target="_blank"><img src="a-thin-gold.png" alt="A · 细金边简化卡框"></a><p>保留单层细金边与切角，去掉星饰和叠层金属结构。</p></article><article><h2>B · 扁平色块</h2><a class="frame" href="b-flat-blocks.png" target="_blank"><img src="b-flat-blocks.png" alt="B · 扁平色块简化卡框"></a><p>用圆角紫色色块划分区域，仅保留一条金色分隔线。</p></article><article><h2>C · 轻纸质</h2><a class="frame" href="c-light-paper.png" target="_blank"><img src="c-light-paper.png" alt="C · 轻纸质简化卡框"></a><p>以奶油纸色为主，深紫细线划分区域，视觉更轻。</p></article><article><h2>D · 极简通栏</h2><a class="frame" href="d-open-window.png" target="_blank"><img src="d-open-window.png" alt="D · 极简通栏简化卡框"></a><p>缩窄外框与费用栏，扩大插画窗口，装饰最少。</p></article></section><footer><p>内置 ImageGen 制作 · <a href="prompts.json">完整提示词</a></p></footer></main><script>document.getElementById('size').onclick=function(){const small=document.querySelector('.grid').classList.toggle('small');this.textContent=small?'查看放大细节':'查看游戏尺寸 150 × 210';};</script></html>
